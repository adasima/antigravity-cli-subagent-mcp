name: CI

on:
  # Manual runs only, to save Actions minutes; tests are run locally before each commit
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    # Pinned to bash so a non-blocking `|| echo` keeps working on windows-latest
    # (the Windows default, pwsh, fails the step on a command's exit code)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test --all-targets --verbose
