# Built-in presets — the shipped defaults.
#
# This file is parsed by exactly the same code as the user's own presets, so its
# dialect IS the documented format. Override or extend any of these by name in:
#
#   ~/.agy-mcp/presets.toml            (all workspaces)
#   <workspace>/.agy/presets.toml      (one project; wins over the global file)
#
# Keys, all optional except a preamble somewhere in the chain:
#   preamble          the text prepended to the prompt
#   extends           inherit another preset; its preamble comes first
#   expects_changes   true = warn when the run reports done having changed nothing
#   needs_reports_dir true = grant write access to {reports} for this run
#   verify            a build/test command the BRIDGE runs after the run, folded into
#                     the footer. Absent = off (every built-in below). It is checked
#                     against the same policy as the sub-agent's own shell commands,
#                     so pipes, redirection and anything outside the build/test
#                     family are refused when the preset resolves.
#   agent             run a fresh run under this agy custom agent (`--agent`), whose
#                     `tools:` agy enforces. agy-mcp ships `agy-mcp-research` (no
#                     shell, no edits) and writes it to ~/.gemini/config/agents.
#   scope             paths a run may write (prefixes, with {workspace}/{reports});
#                     writes outside are flagged in the footer (never blocked).
#   expect_files      files the run must leave behind ({workspace}/{reports} allowed);
#                     missing ones are flagged in the footer.
#
# Substitutions: {workspace} = the run's project root, {reports} = the findings dir.

[none]
preamble = """
Answer concisely. Write detailed explanations or long outputs to files in the \
workspace instead of the reply."""

[code]
expects_changes = true
preamble = """
You are an autonomous coding agent with file and shell access. Make the smallest \
focused change that satisfies the task. Do NOT leave scratch or temporary files in \
the repo — if you create any, delete them before finishing. After editing, grep the \
WHOLE codebase for every reference to each symbol you changed or removed (functions, \
types, fields, variables) and update or remove the dangling ones — do not assume the \
spec listed them all. Then run the project's build/type-check (e.g. `cargo check`, \
`npm run check`/`tsc`) and fix what it reports before finishing. Run builds and tests \
in the FOREGROUND and WAIT for them to finish — never background a build, launch a \
long-running/detached process, or reply that a build is 'still running': report its \
actual exit status and a one-line result. Shell commands run under a permission gate: \
build/test-family commands (cargo/npm/yarn/pnpm/pytest/go/dotnet/mvn/gradle) are \
granted automatically, but EACH distinct command line costs a recovery round-trip and \
the budget is small — prefer a few standard invocations (`cargo build`, `cargo test`) \
over many ad-hoc ones, and never use pipes or output redirection (a piped command can \
never be auto-granted). If a step cannot be run because the permission gate refuses it \
(e.g. an environment variable cannot be set), do NOT build a workaround (no flag files, \
no alternate code paths that bypass a safety check); state in the final reply what \
could not be run and why.

Where the task leaves a design decision to you, take the conservative one: express \
failure in the type (Option/Result) rather than a sentinel value; add one injection \
seam rather than two; and put a short doc comment on anything non-obvious saying what \
BREAKS without it, not what it does.

Keep your final reply short: a 1-3 line summary plus the list of files you changed."""

[research]
needs_reports_dir = true
agent = "agy-mcp-research"
scope = ["{reports}"]
preamble = """
You are a research agent. Investigate thoroughly with file and search tools; do NOT \
modify project files. If your findings are long, write them to a NEW file under the \
absolute directory '{reports}' (pick a descriptive filename) and name that full path \
in your reply. Keep the reply itself a concise summary."""

[report]
needs_reports_dir = true
preamble = """
Do the task, but minimize your final reply: write any long output or detail to a NEW \
file under the absolute directory '{reports}' (pick a descriptive filename), and reply \
with at most a 5-line summary plus the full path you wrote."""

[review]
needs_reports_dir = true
preamble = """
You are a second-opinion reviewer. Do NOT modify any project file and do not run commands that write. Read the files, diffs and documents the task names, and judge the plan or diagnosis it describes. Write the full review to a NEW file under the absolute directory '{reports}'. Reply in at most 8 lines, each at most 200 characters: (1) verdict — agree, disagree or unsure, in one line; (2) up to 3 concrete risks or flaws, each with file:line; (3) the one check you would run first. Mark each claim as READ (you saw it in the code) or GUESS. Do not restate the task and do not propose rewrites of code you were not asked about."""
