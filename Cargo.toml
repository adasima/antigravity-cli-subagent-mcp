[package]
name = "agy-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server that hands tasks to the official Antigravity CLI (agy) as a sub-agent and returns its report."
license = "MIT"
repository = "https://github.com/adasima/antigravity-cli-subagent-mcp"

[[bin]]
name = "agy-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-std", "time", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Presets are hand-edited prose, so the format has to carry multi-line strings
# without escaping newlines. Parse only — the bridge never writes a presets file.
toml = { version = "0.8", default-features = false, features = ["parse"] }
schemars = "1"
anyhow = "1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2.189"

# Job objects: stop agy's whole process tree, not just agy.exe (src/agy/jobobj.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# Test-only. The permission grants are `regex:` rules that agy (Go, RE2) evaluates,
# so the patterns are asserted against an RE2-compatible engine here instead of
# costing a live run each. Not linked into the binary.
regex = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1

[[bench]]
name = "job_records_bench"
harness = false

[[bench]]
name = "apply_mcp_swap_bench"
harness = false
